services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - backend_data_prod:/app/data
    ports:
      - "8000:8000"
    env_file: .env.production
    environment:
      - APP_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  backend_data_prod:
