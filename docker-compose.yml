services:
  backend:
    build:
      context: .           # root of the repository — access to pyproject.toml + uv.lock
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend/app:/app/app   # hot-reload
      - backend_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - APP_ENV=development
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  backend_data:
